name: Bug report
description: Something in Imagination isn't working the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem! The more detail you give, the faster it can be fixed.
        Please search the [existing issues](https://github.com/MistRazor/imagination/issues) first, in case it's already been reported.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: When I press I while holding sneak, I enter the shared layer instead of my private one.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can someone else make this happen?
      placeholder: |
        1. Join a server running Imagination
        2. Hold sneak and press I
        3. Place a block
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options:
        - Fabric
        - NeoForge
    validations:
      required: true

  - type: input
    id: mc-version
    attributes:
      label: Minecraft version
      placeholder: e.g. 1.21.1
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Imagination version
      description: Shown in the mod list or the jar's file name.
      placeholder: e.g. 1.0.0-beta.3
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where were you playing?
      options:
        - Singleplayer
        - LAN world
        - Server with Imagination installed
        - Server without Imagination (vanilla or other mods)
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Which imaginary layer was involved?
      options:
        - Shared layer
        - Private layer
        - Both
        - Not sure / not relevant
    validations:
      required: false

  - type: textarea
    id: other-mods
    attributes:
      label: Other mods installed
      description: List them, or say "None". Shader packs, Sodium, Iris, Litematica and similar mods are especially useful to know about.
      placeholder: Fabric API 0.100.0, Sodium 0.5.11, Mod Menu 11.0.1
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: |
        If the game crashed, attach the crash report from `.minecraft/crash-reports`.
        Otherwise, `.minecraft/logs/latest.log` is the most helpful file. Drag the file in, or upload it to [mclo.gs](https://mclo.gs) and paste the link.
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Drag images or videos here if they help show the problem.
    validations:
      required: false
